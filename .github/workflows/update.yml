name: 전국 음식물처리기 보조금 자동 점검 (2시간마다)

on:
  schedule:
    - cron: "7 */2 * * *"    # 2시간마다 (매 짝수시 7분, UTC)
  workflow_dispatch: {}       # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: subsidy-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 전국 230개 지자체 × 연관검색어 점검 (네이버 + Google 뉴스 교차)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/update.py
      - name: 공고문 링크·담당 전화번호 더블체크
        continue-on-error: true
        run: python scripts/verify_links.py
      - name: 지자체 공식 누리집·대표번호 더블체크
        continue-on-error: true
        run: python scripts/check_sites.py
      - name: LG전자 베스트샵 매장 목록 갱신
        continue-on-error: true
        run: python scripts/fetch_bestshops.py
      - name: 페이지에 최신 데이터·최종 업데이트 시각 내장
        run: python scripts/build_html.py
      - name: 변경 사항 커밋
        run: |
          git config user.name  "subsidy-bot"
          git config user.email "subsidy-bot@users.noreply.github.com"
          git add coverage.json candidates.json index.html link_check.json bestshops.json site_check.json 2>/dev/null || git add coverage.json candidates.json index.html
          git diff --cached --quiet || git commit -m "자동 점검 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q || true
          git push
